<!DOCTYPE html>
<html>
<head>
<title>Level 0 Boss Challenge</title>
<meta charset="UTF-8">
  <meta name="description" content="Level 0">
  <meta name="keywords" content="Level 0, Game Prototyping, New England Institute of Technology">
  <meta name="author" content="John Doe">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<canvas id="myCanvas" width="1000" height="800" style="border:1px solid black;">
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

ctx.beginPath();
ctx.arc(500, 450, 40, 0, 2 * Math.PI);
ctx.fillStyle = "purple";
ctx.fill();
ctx.lineWidth = 2;
ctx.strokeStyle = "black";
ctx.stroke();
</script>
<body>
</body>
</html>
